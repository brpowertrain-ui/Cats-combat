
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hamster Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 0; padding: 16px; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    .box { border-radius: 14px; padding: 16px; margin: 10px 0; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    button { width: 100%; padding: 14px 16px; font-size: 16px; border-radius: 12px; border: none; margin: 8px 0; }
  </style>
</head>
<body>
  <h1>🐹 Hamster Mini App</h1>
  <div class="box">
    <div id="user"></div>
    <div id="status" style="margin-top:8px; opacity:.8"></div>
  </div>

  <div class="box">
    <button id="tapBtn">🐹 TAP</button>
    <button id="dailyBtn">🎁 DAILY</button>
    <button id="statsBtn">📊 STATS</button>
  </div>

  <script src="./app.js"></script>
</body>
</html>
